name: Test_Application

on:
  push:
    branches: ["pipeline"]
  pull_request:
    branches: ["main"]

jobs:
  # Job 0: Security
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gacts/gitleaks@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 1: Build
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Scan .NET dependencies
        run: |
          dotnet list backend/backend.csproj package --vulnerable --include-transitive > dotnet-vulnerabilities.txt
          cat dotnet-vulnerabilities.txt
          if grep -Eiq "(Critical|High)" dotnet-vulnerabilities.txt; then
            echo "High/Critical vulnerabilities found."
            exit 1
          fi

      - name: Build backend
        run: dotnet build --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json
            tests/playwright/package-lock.json
            tests/postman/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Scan frontend npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish backend
        run: dotnet publish backend/backend.csproj -c Release -o out --no-restore

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-wwwroot
          path: backend/wwwroot/

      - name: Validate Docker build
        run: docker build -t wordslayer:ci .

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.63.0 image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            wordslayer:ci

  # Job 2: Tests
  tests:
    needs: [security, build]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        suite: [unit, api, ui]

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-wwwroot
          path: backend/wwwroot/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            tests/playwright/package-lock.json
            tests/postman/package-lock.json

      - name: Install system test dependencies
        if: ${{ matrix.suite != 'unit' }}
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        if: ${{ matrix.suite == 'ui' }}
        working-directory: tests/playwright
        run: npx playwright install

      - name: Run unit tests
        if: ${{ matrix.suite == 'unit' }}
        run: dotnet test tests/wordslayer.Tests --logger "trx:LogFileName=unit-tests.trx" --result-directory TestResults

      - name: Run API tests
        if: ${{ matrix.suite == 'api' }}
        run: |
          dotnet run --project backend/backend.csproj --urls http://localhost:5010 &
          sleep 8
          cd tests/postman
          npm run test:api:ci

      - name: Run UI tests
        if: ${{ matrix.suite == 'ui' }}
        run: |
          dotnet run --project backend/backend.csproj --urls http://localhost:5010 &
          sleep 8
          cd tests/playwright
          npm run test:ui

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          path: |
            TestResults/**
            tests/test-results/**
            tests/playwright-report/**
          if-no-files-found: ignore

  # Job 3: Report
  report:
    needs: tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: artifacts/
          merge-multiple: true

      - name: Publish pipeline summary
        run: |
          echo "## CI Rapport" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: klart" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tester: unit/api/ui körda" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artefakter:" >> "$GITHUB_STEP_SUMMARY"
          find artifacts -type f | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"